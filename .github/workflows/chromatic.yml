name: 'Chromatic'
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches-ignore:
      - renovate/*
      - stable-*

jobs:
  pathcheck:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            src:
              - 'package.json'
              - 'yarn.lock'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '.github/workflows/chromatic.yml'

  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pathcheck
    if: github.repository == 'koba-lab/mastodon' && needs.pathcheck.outputs.changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Build Storybook
        run: yarn build-storybook

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@07791f8243f4cb2698bf4d00426baf4b2d1cb7e0 # v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          zip: true
          storybookBuildDir: 'storybook-static'
          autoAcceptChanges: 'main' # Auto-accept changes on main branch only
          # ikatodon: 撮影対象を ikadon の Story (title が Ikadon/*) に限定する。
          # onlyStoryFiles '**/*.ikadon.stories.tsx' では絞り込めなかった
          # （detail: docs/ikadon-theme.md の「VRT (Chromatic)」節）
          onlyStoryNames: 'Ikadon/*'
          # ikatodon: Story 単位の結果を JUnit XML で得る（既定のファイル名は
          # chromatic-build-{buildNumber}.xml、カレントディレクトリに出力される）
          junitReport: true
          # ikatodon: exitOnceUploaded は付けない。付けるとテスト完了前にジョブが終了し
          # errorCount 等の outputs が空のまま読まれてしまうため

      # ikatodon: outputs と JUnit XML の失敗詳細を summary/PR コメントに書き出す。
      # commit status だけでは失敗理由が判別できないため（詳細は docs/ikadon-theme.md）
      - name: Report results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ERROR_COUNT: ${{ steps.chromatic.outputs.errorCount }}
          INTERACTION_TEST_FAILURES_COUNT: ${{ steps.chromatic.outputs.interactionTestFailuresCount }}
          CHANGE_COUNT: ${{ steps.chromatic.outputs.changeCount }}
          TEST_COUNT: ${{ steps.chromatic.outputs.testCount }}
          ACTUAL_CAPTURE_COUNT: ${{ steps.chromatic.outputs.actualCaptureCount }}
          COMPONENT_COUNT: ${{ steps.chromatic.outputs.componentCount }}
          SPEC_COUNT: ${{ steps.chromatic.outputs.specCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        run: |
          # key の並び順を1箇所にまとめ、テーブルと ```code``` ブロックの両方で使い回す
          keys=(errorCount interactionTestFailuresCount changeCount testCount \
                actualCaptureCount componentCount specCount buildUrl storybookUrl)
          declare -A values=(
            [errorCount]="$ERROR_COUNT"
            [interactionTestFailuresCount]="$INTERACTION_TEST_FAILURES_COUNT"
            [changeCount]="$CHANGE_COUNT"
            [testCount]="$TEST_COUNT"
            [actualCaptureCount]="$ACTUAL_CAPTURE_COUNT"
            [componentCount]="$COMPONENT_COUNT"
            [specCount]="$SPEC_COUNT"
            [buildUrl]="$BUILD_URL"
            [storybookUrl]="$STORYBOOK_URL"
          )
          {
            echo "## Chromatic 結果"
            echo ""
            echo "| key | value |"
            echo "| --- | --- |"
            for k in "${keys[@]}"; do
              echo "| $k | ${values[$k]:-N/A} |"
            done
            echo ""
            echo '```'
            for k in "${keys[@]}"; do
              echo "$k=${values[$k]:-}"
            done
            echo '```'

            junit_file=$(ls chromatic-build-*.xml 2>/dev/null | head -n1 || true)
            if [ -n "$junit_file" ]; then
              echo ""
              echo "### 失敗した Story"
              echo ""
              python3 .github/scripts/chromatic_junit_summary.py "$junit_file"
            else
              echo ""
              echo "(JUnit XML が見つかりませんでした)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" | tee /tmp/chromatic-summary.md

          # ikatodon: chromatic.yml は push トリガーなので github.event.pull_request が無い。
          # push されたブランチに紐づく open な PR を探してコメントする
          pr_number=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" \
              --repo "${{ github.repository }}" \
              --edit-last \
              --create-if-none \
              --body-file /tmp/chromatic-summary.md
          else
            echo "対応する open な PR が見つからなかったため、PR コメントはスキップしました"
          fi

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromatic-junit-report
          path: chromatic-build-*.xml
          if-no-files-found: ignore

      - name: Fail if Chromatic reported real errors
        if: always()
        env:
          ERROR_COUNT: ${{ steps.chromatic.outputs.errorCount }}
          INTERACTION_TEST_FAILURES_COUNT: ${{ steps.chromatic.outputs.interactionTestFailuresCount }}
        run: |
          if [ "${ERROR_COUNT:-0}" -gt 0 ] || [ "${INTERACTION_TEST_FAILURES_COUNT:-0}" -gt 0 ]; then
            echo "Chromatic reported ${ERROR_COUNT:-0} rendering error(s) and ${INTERACTION_TEST_FAILURES_COUNT:-0} interaction test failure(s). See the summary above."
            exit 1
          fi
