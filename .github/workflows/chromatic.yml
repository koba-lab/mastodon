name: 'Chromatic'
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - renovate/*
      - stable-*

jobs:
  pathcheck:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            src:
              - 'package.json'
              - 'yarn.lock'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '.github/workflows/chromatic.yml'

  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pathcheck
    if: github.repository == 'koba-lab/mastodon' && needs.pathcheck.outputs.changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Build Storybook
        run: yarn build-storybook
        env:
          # ikatodon: Chromatic に上げるビルドは ikadon の Story だけにする。
          # 上流 Story を含めると、撮影対象外でも前回ビルドの BROKEN ステータスを
          # 引き継ぎ続け、UI Tests が恒久的に赤くなる
          # （detail: docs/ikadon-theme.md の「VRT (Chromatic)」節）
          IKADON_STORIES_ONLY: '1'

      # ikatodon: ビルドを ikadon の Story だけに絞っているため、このステップの
      # 合否（errorCount）がそのまま「ikadon の Story が壊れていないか」を表す。
      # 視覚差分（changeCount）ではジョブを落とさない — その判定は Chromatic 側の
      # commit status (UI Tests) に委ね、人間が Chromatic の Web UI で見て承認する
      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@07791f8243f4cb2698bf4d00426baf4b2d1cb7e0 # v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          zip: true
          storybookBuildDir: 'storybook-static'
          autoAcceptChanges: 'main' # Auto-accept changes on main branch only
          exitZeroOnChanges: true
          # ikatodon: Story 単位の結果を JUnit XML で得る（既定のファイル名は
          # chromatic-build-{buildNumber}.xml、カレントディレクトリに出力される）。
          # Story が壊れた場合に AI エージェントが原因をテキストで読むための唯一の経路
          junitReport: true
          # ikatodon: exitOnceUploaded は付けない。付けるとテスト完了前にジョブが終了し
          # JUnit XML に結果が入らない

      # ikatodon: JUnit XML から失敗した Story の一覧を summary に書き出す。
      # commit status だけでは失敗理由が判別できないため（詳細は docs/ikadon-theme.md）
      - name: Report failed stories
        if: always()
        run: |
          junit_file=$(ls chromatic-build-*.xml 2>/dev/null | head -n1 || true)
          {
            echo "## Chromatic で壊れた Story"
            echo ""
            if [ -n "$junit_file" ]; then
              python3 .github/scripts/chromatic_junit_summary.py "$junit_file"
            else
              echo "(JUnit XML が見つかりませんでした)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromatic-junit-report
          path: chromatic-build-*.xml
          if-no-files-found: ignore
