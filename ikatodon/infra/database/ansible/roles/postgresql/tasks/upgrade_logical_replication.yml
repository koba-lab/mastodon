---
# PostgreSQL 16サーバーでのレプリケーション設定
# 注: このファイルは新サーバー側の設定のみを含みます

- name: データベースユーザーの作成
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: CREATEDB,SUPERUSER
  become: true
  become_user: postgres

- name: データベースの作成
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    encoding: UTF8
    lc_collate: "ja_JP.UTF-8"
    lc_ctype: "ja_JP.UTF-8"
    template: template0
  become: true
  become_user: postgres

- name: サブスクリプションの作成
  postgresql_query:
    db: "{{ db_name }}"
    query: >
      CREATE SUBSCRIPTION mastodon_sub 
      CONNECTION 'host={{ hostvars[groups['postgresql_servers'][0]]['private_ip'] }} 
                 dbname={{ db_name }} 
                 user={{ db_user }} 
                 password={{ db_password }}' 
      PUBLICATION mastodon_pub;
  become: true
  become_user: postgres
  register: create_subscription
  failed_when: create_subscription.failed and "already exists" not in create_subscription.stderr|default('')
  when: enable_replication | default(false)

- name: レプリケーションの進行状況を確認
  postgresql_query:
    db: "{{ db_name }}"
    query: "SELECT * FROM pg_stat_subscription;"
  become: true
  become_user: postgres
  register: replication_status
  until: >
    replication_status.query_result[0].relid == 0 and
    replication_status.query_result[0].received_lsn == replication_status.query_result[0].latest_end_lsn
  retries: 60
  delay: 10
  when: enable_replication | default(false)
